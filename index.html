<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>《魔塔世界》</title>
  <link rel="icon" type="image/svg+xml" href="./images/heroes/avatar_warrior.svg">
  <script src="./js/vendor/tailwindcss.min.js"></script>
  <link rel="stylesheet" href="./css/mota-theme.css">
  <link rel="stylesheet" href="./css/battle.css">
  <!-- 原版《魔塔世界》色板覆盖层。不需要时删除本行即可完全恢复原样。 -->
  <link rel="stylesheet" href="./css/original-ui.css">
  <link rel="stylesheet" href="./css/classic-shell.css">
  <link rel="stylesheet" href="./css/pet-classic.css">
  <link rel="stylesheet" href="./css/classic-materials.css">
  <link rel="stylesheet" href="./css/ui-refinements.css">
  <link rel="stylesheet" href="./css/scene-layout.css">
  <link rel="stylesheet" href="./css/icon-consistency.css">
  <link rel="stylesheet" href="./css/button-theme-sample.css">
  <link rel="stylesheet" href="./css/bag-grid.css">
  <link rel="stylesheet" href="./css/font-theme.css">
  <link rel="stylesheet" href="./css/parchment-soft.css">
  <link rel="stylesheet" href="./css/layout-1024-fix.css">
</head>
<body class="bg-[#0b0806] text-[#e5ded3] h-screen overflow-hidden select-none p-1 sm:p-2 flex flex-col items-center justify-center">

  <div class="mota-client-shell classic-client">
    <canvas id="atmosphere-canvas" class="hidden" aria-hidden="true"></canvas>
    <header class="classic-topbar">
      <h1>魔塔世界</h1>
      <div class="classic-currencies"><span>金币 <b id="header-gold">0</b></span><span>魔晶 <b id="header-crystal">0</b></span><span>声望 <b id="header-prestige">0</b></span><span id="header-action-day" class="header-action-day">第 1 行动日 · 行动点 30/30</span></div>
      <div class="classic-save-tools"><span id="header-active-slot-text">存档 1</span><button id="btn-open-archive" class="mota-btn-dark">存档管理</button><button id="btn-new-game-entry" class="mota-btn-dark">新开游戏</button></div>
    </header>
    <nav class="classic-navigation" aria-label="游戏功能"><button id="nav-tab-hero" class="mota-btn-dark">人物</button><button id="nav-tab-equip" class="mota-btn-dark">装备</button><button id="nav-tab-bag" class="mota-btn-dark">行囊</button><button id="nav-tab-pets" class="mota-btn-dark">神兽</button><button id="nav-tab-tower" class="mota-btn-dark">魔塔</button><button id="nav-tab-town" class="mota-btn-dark">王都</button><button id="nav-tab-wild" class="mota-btn-dark">野外</button><button id="nav-tab-estate" class="mota-btn-dark">庄园</button></nav>
    <div class="classic-workspace">
      <aside class="classic-sidebar" aria-label="角色信息">
        <h2 class="classic-panel-title">角色信息</h2>
        <button id="header-char-box" class="classic-character" title="查看角色属性"><span id="header-class-icon"></span><strong id="header-player-name">亚诺勇者</strong><span id="header-player-level">Lv.1</span></button>
        <p class="classic-character-title"><span id="header-nation-badge">亚丁</span> · <span id="header-player-class">战士</span></p>
        <p id="header-title-badge" class="classic-rank">见习勇者</p>
        <div class="classic-vitals">
          <label>生命 <span id="header-hp-text">0 / 0</span><i><b id="header-hp-bar"></b></i></label>
          <label>魔力 <span id="header-mp-text">0 / 0</span><i><b id="header-mp-bar"></b></i></label>
          <label>经验 <span id="header-exp-sub">0%</span><i><b id="header-exp-bar"></b></i></label>
          <p id="header-exp-text">0 / 0</p>
        </div>
        <h3 class="classic-section-title">战斗属性</h3><dl class="classic-character-stats"><div><dt>攻击</dt><dd id="classic-stat-atk">—</dd></div><div><dt>防御</dt><dd id="classic-stat-def">—</dd></div><div><dt>速度</dt><dd id="classic-stat-speed">—</dd></div><div><dt>命中</dt><dd id="classic-stat-hit">—</dd></div><div><dt>减伤</dt><dd id="classic-stat-dmg-resist">—</dd></div><div class="classic-stat-secondary"><dt>暴击</dt><dd id="classic-stat-crit">—</dd></div><div class="classic-stat-secondary"><dt>闪避</dt><dd id="classic-stat-dodge">—</dd></div><div class="classic-stat-secondary"><dt>反击</dt><dd id="classic-stat-counter">—</dd></div><div class="classic-stat-secondary"><dt>吸血</dt><dd id="classic-stat-lifesteal">—</dd></div><div class="classic-stat-secondary"><dt>魔抗</dt><dd id="classic-stat-magic-resist">—</dd></div></dl>
        <button id="btn-more-stats" type="button" class="mota-btn-dark classic-more-stats">更多属性</button>
        <p class="classic-interval">野外出手 <strong id="classic-stat-interval">0</strong> 秒</p>
        <h3 class="classic-section-title">冒险手记</h3><p id="classic-adventure-note"></p>
        <button data-classic-tab="hero" class="mota-btn-dark classic-sidebar-action">角色成长与加点</button>
      </aside>
      <div class="classic-stage">
        <section id="journey-guide" class="journey-guide" aria-label="下一步行动"></section>
        <main class="classic-main"><section id="battle-overlay" class="battle-page hidden" aria-label="战斗页面"></section><div id="tab-content-tower" class="w-full h-full block"></div><div id="tab-content-town" class="w-full h-full hidden"></div><div id="tab-content-estate" class="w-full h-full hidden"></div><div id="tab-content-wild" class="w-full h-full hidden"></div><div id="tab-content-hero" class="w-full h-full hidden"></div><div id="tab-content-equip" class="w-full h-full hidden"></div><div id="tab-content-bag" class="w-full h-full hidden"></div><div id="tab-content-pets" class="w-full h-full hidden"></div></main>
      </div>
    </div>
    <footer class="classic-footer">
      <div id="quest-tracker-mount"></div>
      <section class="classic-command-dock" aria-label="角色状态与快捷操作">
        <div class="classic-dock-links"><button data-classic-tab="hero" class="mota-btn-dark">人物</button><button data-classic-tab="equip" class="mota-btn-dark">装备</button><button data-classic-tab="pets" class="mota-btn-dark">神兽</button><button data-classic-tab="bag" class="mota-btn-dark">行囊</button></div>
        <div class="classic-orb classic-health-orb" role="meter" aria-label="生命" aria-valuemin="0" aria-valuemax="100" aria-valuenow="100"><i class="classic-orb-liquid" aria-hidden="true"></i><span>生命</span><b id="classic-hp-orb-text"></b></div>
        <button data-classic-tab="hero" class="classic-dock-portrait" title="查看人物"><span class="class-portrait" data-class-portrait role="img" aria-label="角色立绘"></span><span id="classic-dock-name">亚诺勇者</span></button>
        <div class="classic-orb classic-mana-orb" role="meter" aria-label="魔力" aria-valuemin="0" aria-valuemax="100" aria-valuenow="100"><i class="classic-orb-liquid" aria-hidden="true"></i><span>魔力</span><b id="classic-mp-orb-text"></b></div>
      </section>
      <div id="system-log-mount"></div>
    </footer>
  </div>

  <!-- 角色创建与职业选择全屏弹窗 (Character Select Modal) -->
  <div id="char-select-overlay" class="fixed inset-0 z-50 bg-black/90 backdrop-blur-md hidden items-center justify-center p-4">
    <!-- 内容由 charSelectModal.js 动态渲染 -->
  </div>

  <!-- 圣堂档案馆多槽位存档管理弹窗 (Archive Modal) -->
  <div id="game-archive-overlay" class="fixed inset-0 z-50 bg-black/85 backdrop-blur-md hidden items-center justify-center p-4">
    <!-- 内容由 archiveModal.js 动态渲染 -->
  </div>

  <!-- 2011 经典页游纯内部拟真羊皮纸弹窗 (In-Game Modal Dialog) -->
  <div id="game-modal-overlay" class="fixed inset-0 z-[60] bg-black/80 backdrop-blur-sm hidden items-center justify-center p-4">
    <div id="game-modal-box" role="dialog" aria-modal="true" aria-labelledby="game-modal-title" aria-describedby="game-modal-message" tabindex="-1" class="mota-parchment-panel rounded-2xl border-2 border-[#b48c36] shadow-[0_10px_45px_rgba(0,0,0,0.95)] max-w-md w-full overflow-hidden scale-95 transition-all duration-200 select-none">
      <!-- 弹窗标题栏 (带红漆火印与关闭叉) -->
      <div class="game-modal-heading bg-gradient-to-r from-[#2a1c11] via-[#3d2a1a] to-[#2a1c11] p-3 border-b border-[#b48c36] flex items-center justify-between">
        <div class="flex items-center gap-2">
          <span class="w-3 h-3 rounded-full bg-amber-500 border border-amber-300 shadow inline-block"></span>
          <h3 id="game-modal-title" class="text-sm font-bold text-amber-300 tracking-wide">王国告示</h3>
        </div>
        <button id="game-modal-close" aria-label="关闭弹窗" class="text-slate-400 hover:text-amber-200 text-sm font-bold w-6 h-6 rounded flex items-center justify-center hover:bg-black/40">x</button>
      </div>
      <!-- 弹窗正文区 -->
      <div class="p-5 space-y-3 bg-[#17130f]/95 text-xs text-slate-200">
        <div id="game-modal-message" class="leading-relaxed whitespace-pre-line text-xs text-slate-200 bg-black/40 p-3.5 rounded-xl border border-[#4a3520]">
          <!-- 动态文本 -->
        </div>
      </div>
      <!-- 弹窗交互按键栏 -->
      <div id="game-modal-actions" class="p-3 bg-black/50 border-t border-[#4a3520] flex items-center justify-end gap-2.5">
        <button id="game-modal-btn-cancel" class="mota-btn-dark px-4 py-1.5 rounded-lg text-xs font-semibold hidden">放弃</button>
        <button id="game-modal-btn-confirm" class="mota-btn-gold px-5 py-1.5 rounded-lg text-xs font-bold shadow-md">领命 / 确定</button>
      </div>
    </div>
  </div>

  <!-- 玩家异常提示；技术详情仅记录到控制台 -->
  <div id="runtime-error-display" role="alert" class="mota-parchment-panel" style="display:none;position:fixed;bottom:12px;right:12px;padding:12px 16px;font-size:12px;z-index:999999;box-shadow:0 10px 25px rgba(0,0,0,0.85);max-width:min(550px,calc(100vw - 24px));max-height:240px;overflow:auto;border:1px solid #9c8257;"><span data-error-message></span></div>
  <script>
    var gameStartupFinished = false;
    var gameStartupTimer = setTimeout(function() { showStartupNotice(); }, 8000);
    function showStartupNotice() {
      if (gameStartupFinished) return;
      var el = document.getElementById('runtime-error-display');
      if (!el || el.dataset.startup === 'true') return;
      el.dataset.startup = 'true';
      el.style.display = 'block';
      (el.querySelector('[data-error-message]') || el).textContent = '游戏尚未启动完成。可以继续等待，或重新载入页面后继续冒险。';
      var retry = document.createElement('button');
      retry.id = 'btn-retry-startup';
      retry.className = 'mota-btn-gold';
      retry.style.cssText = 'display:block;margin-top:10px;padding:6px 12px';
      retry.textContent = '重新载入';
      retry.onclick = function() { window.location.reload(); };
      el.appendChild(retry);
      retry.focus();
    }
    window.completeGameStartup = function() {
      gameStartupFinished = true;
      clearTimeout(gameStartupTimer);
      var el = document.getElementById('runtime-error-display');
      if (!el || el.dataset.startup !== 'true') return;
      var restoreFocus = el.contains(document.activeElement);
      el.style.display = 'none';
      (el.querySelector('[data-error-message]') || el).textContent = '';
      el.querySelector('#btn-retry-startup')?.remove();
      delete el.dataset.startup;
      if (restoreFocus) {
        var target = document.querySelector('#char-select-overlay:not(.hidden) [data-class-id]') ||
          document.getElementById('btn-next-journey');
        if (target) target.focus();
      }
    };
    function showGameErrorNotice() {
      if (!gameStartupFinished) { showStartupNotice(); return; }
      var el = document.getElementById('runtime-error-display');
      if (el) {
        el.style.display = 'block';
        (el.querySelector('[data-error-message]') || el).textContent = '游戏遇到异常，请刷新页面后重试。若问题持续，请反馈发生前的操作。';
      }
    }
    window.addEventListener('error', function(e) {
      // Module dependency failures reach the entry script as a non-bubbling resource error.
      if (!e.message && e.target.id !== 'game-module-entry') return;
      console.error('Window error captured:', e);
      showGameErrorNotice();
    }, true);
    window.addEventListener('unhandledrejection', function(e) {
      console.error('Unhandled rejection:', e);
      showGameErrorNotice();
    });
  </script>
  <script id="game-module-entry" type="module" src="./js/main.js?v=20260905_2"></script>
</body>
</html>
