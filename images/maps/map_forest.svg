<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" class="w-full h-full">
<defs>
  <linearGradient id="map_bg_forest" x1="0%" y1="0%" x2="0%" y2="100%">
    <stop offset="0%" stop-color="#064e3b"/><stop offset="100%" stop-color="#020617"/>
  </linearGradient>
  <filter id="f_mglow_forest">
    <feGaussianBlur stdDeviation="3" result="blur"/>
    <feComposite in="SourceGraphic" in2="blur" operator="over"/>
  </filter>
</defs>
<rect width="320" height="180" fill="url(#map_bg_forest)"/>
<!-- 地貌与建筑剪影 -->
<polygon points="20,180 50,110 80,180" fill="#065f46"/><polygon points="90,180 130,90 170,180" fill="#047857"/><polygon points="200,180 240,100 280,180" fill="#065f46"/>
<!-- 暗黑哥特暗角 -->
<rect width="320" height="180" fill="none" stroke="#000000" stroke-width="6" opacity="0.7"/>
</svg>