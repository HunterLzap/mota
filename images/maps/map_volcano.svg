<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" class="w-full h-full">
<defs>
  <linearGradient id="map_bg_volcano" x1="0%" y1="0%" x2="0%" y2="100%">
    <stop offset="0%" stop-color="#7f1d1d"/><stop offset="100%" stop-color="#020617"/>
  </linearGradient>
  <filter id="f_mglow_volcano">
    <feGaussianBlur stdDeviation="3" result="blur"/>
    <feComposite in="SourceGraphic" in2="blur" operator="over"/>
  </filter>
</defs>
<rect width="320" height="180" fill="url(#map_bg_volcano)"/>
<!-- 地貌与建筑剪影 -->
<polygon points="60,180 160,60 260,180" fill="#18181b"/><polygon points="140,60 160,80 180,60" fill="#ea580c" filter="url(#f_mglow_volcano)"/>
<!-- 暗黑哥特暗角 -->
<rect width="320" height="180" fill="none" stroke="#000000" stroke-width="6" opacity="0.7"/>
</svg>