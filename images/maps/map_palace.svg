<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" class="w-full h-full">
<defs>
  <linearGradient id="map_bg_palace" x1="0%" y1="0%" x2="0%" y2="100%">
    <stop offset="0%" stop-color="#450a0a"/><stop offset="100%" stop-color="#090d16"/>
  </linearGradient>
  <filter id="f_mglow_palace">
    <feGaussianBlur stdDeviation="3" result="blur"/>
    <feComposite in="SourceGraphic" in2="blur" operator="over"/>
  </filter>
</defs>
<rect width="320" height="180" fill="url(#map_bg_palace)"/>
<!-- 地貌与建筑剪影 -->
<polygon points="60,180 60,60 100,40 220,40 260,60 260,180" fill="#1c1917" stroke="#f59e0b" stroke-width="2"/><circle cx="160" cy="80" r="16" fill="#78350f" stroke="#eab308" stroke-width="2"/>
<!-- 暗黑哥特暗角 -->
<rect width="320" height="180" fill="none" stroke="#000000" stroke-width="6" opacity="0.7"/>
</svg>