<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" class="w-full h-full">
<defs>
  <linearGradient id="map_bg_arena" x1="0%" y1="0%" x2="0%" y2="100%">
    <stop offset="0%" stop-color="#831843"/><stop offset="100%" stop-color="#020617"/>
  </linearGradient>
  <filter id="f_mglow_arena">
    <feGaussianBlur stdDeviation="3" result="blur"/>
    <feComposite in="SourceGraphic" in2="blur" operator="over"/>
  </filter>
</defs>
<rect width="320" height="180" fill="url(#map_bg_arena)"/>
<!-- 地貌与建筑剪影 -->
<ellipse cx="160" cy="120" rx="120" ry="40" fill="#1e293b" stroke="#f59e0b" stroke-width="2"/><line x1="80" y1="120" x2="240" y2="120" stroke="#f43f5e" stroke-width="1.5"/>
<!-- 暗黑哥特暗角 -->
<rect width="320" height="180" fill="none" stroke="#000000" stroke-width="6" opacity="0.7"/>
</svg>