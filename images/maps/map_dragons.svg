<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" class="w-full h-full">
<defs>
  <linearGradient id="map_bg_dragons" x1="0%" y1="0%" x2="0%" y2="100%">
    <stop offset="0%" stop-color="#311042"/><stop offset="100%" stop-color="#020617"/>
  </linearGradient>
  <filter id="f_mglow_dragons">
    <feGaussianBlur stdDeviation="3" result="blur"/>
    <feComposite in="SourceGraphic" in2="blur" operator="over"/>
  </filter>
</defs>
<rect width="320" height="180" fill="url(#map_bg_dragons)"/>
<!-- 地貌与建筑剪影 -->
<polygon points="40,180 100,80 160,130 220,70 280,180" fill="#0f172a" stroke="#a855f7" stroke-width="1.5"/><circle cx="160" cy="50" r="12" fill="#ef4444" filter="url(#f_mglow_dragons)"/>
<!-- 暗黑哥特暗角 -->
<rect width="320" height="180" fill="none" stroke="#000000" stroke-width="6" opacity="0.7"/>
</svg>