<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" class="w-full h-full">
<defs>
  <linearGradient id="map_bg_canyon" x1="0%" y1="0%" x2="0%" y2="100%">
    <stop offset="0%" stop-color="#3b0764"/><stop offset="100%" stop-color="#090d16"/>
  </linearGradient>
  <filter id="f_mglow_canyon">
    <feGaussianBlur stdDeviation="3" result="blur"/>
    <feComposite in="SourceGraphic" in2="blur" operator="over"/>
  </filter>
</defs>
<rect width="320" height="180" fill="url(#map_bg_canyon)"/>
<!-- 地貌与建筑剪影 -->
<polygon points="0,60 110,180 0,180" fill="#1e1b4b"/><polygon points="320,60 210,180 320,180" fill="#1e1b4b"/>
<!-- 暗黑哥特暗角 -->
<rect width="320" height="180" fill="none" stroke="#000000" stroke-width="6" opacity="0.7"/>
</svg>