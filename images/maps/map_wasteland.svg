<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" class="w-full h-full">
<defs>
  <linearGradient id="map_bg_wasteland" x1="0%" y1="0%" x2="0%" y2="100%">
    <stop offset="0%" stop-color="#78350f"/><stop offset="100%" stop-color="#0c0a09"/>
  </linearGradient>
  <filter id="f_mglow_wasteland">
    <feGaussianBlur stdDeviation="3" result="blur"/>
    <feComposite in="SourceGraphic" in2="blur" operator="over"/>
  </filter>
</defs>
<rect width="320" height="180" fill="url(#map_bg_wasteland)"/>
<!-- 地貌与建筑剪影 -->
<polygon points="0,180 80,130 180,150 260,110 320,180" fill="#292524"/><path d="M120 140 Q160 90 200 140" stroke="#f59e0b" stroke-width="3" fill="none"/>
<!-- 暗黑哥特暗角 -->
<rect width="320" height="180" fill="none" stroke="#000000" stroke-width="6" opacity="0.7"/>
</svg>