<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" class="w-full h-full">
<defs>
  <linearGradient id="map_bg_tavern" x1="0%" y1="0%" x2="0%" y2="100%">
    <stop offset="0%" stop-color="#78350f"/><stop offset="100%" stop-color="#0c0a09"/>
  </linearGradient>
  <filter id="f_mglow_tavern">
    <feGaussianBlur stdDeviation="3" result="blur"/>
    <feComposite in="SourceGraphic" in2="blur" operator="over"/>
  </filter>
</defs>
<rect width="320" height="180" fill="url(#map_bg_tavern)"/>
<!-- 地貌与建筑剪影 -->
<polygon points="40,180 40,80 160,40 280,80 280,180" fill="#1c1917" stroke="#b45309" stroke-width="2"/>
<!-- 暗黑哥特暗角 -->
<rect width="320" height="180" fill="none" stroke="#000000" stroke-width="6" opacity="0.7"/>
</svg>